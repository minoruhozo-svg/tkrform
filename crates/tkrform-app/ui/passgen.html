<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TKRForm</title>
<link rel="stylesheet" href="common.css">
<style>
  main { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
  #out { font-family: var(--mono); font-size: 17px; letter-spacing: 0.5px; padding: 10px; }
  fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px 10px; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  legend { font-size: 12px; color: var(--ink-sub); padding: 0 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  .len { display: grid; grid-template-columns: 1fr 70px; gap: 10px; align-items: center; }
  #hist li { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
  #hist { list-style: none; margin: 0; padding: 0; }
  #hist .pw { font-family: var(--mono); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <input type="text" id="out" readonly aria-label="" data-i18n-aria="PassGen_Output">
  <div id="meter-host"></div>
  <div class="sub" id="bits" aria-live="polite"></div>
  <div class="row">
    <button type="button" id="gen" class="primary" data-i18n="PassGen_Generate"></button>
    <button type="button" id="copy" data-i18n="PassGen_Copy"></button>
    <button type="button" id="type" data-i18n="PassGen_Type"></button>
    <div class="grow"></div>
    <label class="check"><input type="checkbox" id="ontop"><span data-i18n="PassGen_OnTop"></span></label>
  </div>

  <fieldset>
    <legend data-i18n="PassGen_Mode"></legend>
    <div class="row">
      <label class="check"><input type="radio" name="mode" value="random" checked><span data-i18n="PassGen_Mode_Random"></span></label>
      <label class="check"><input type="radio" name="mode" value="passphrase"><span data-i18n="PassGen_Mode_Passphrase"></span></label>
    </div>
  </fieldset>

  <fieldset id="opt-random">
    <legend data-i18n="PassGen_Options"></legend>
    <div class="len">
      <input type="range" id="length-r" min="4" max="128" aria-label="">
      <input type="number" id="length" min="4" max="512" data-i18n-aria="PassGen_Length">
    </div>
    <div class="sub" data-i18n="PassGen_Length"></div>
    <div class="grid2">
      <label class="check"><input type="checkbox" id="upper"><span data-i18n="PassGen_Upper"></span></label>
      <label class="check"><input type="checkbox" id="lower"><span data-i18n="PassGen_Lower"></span></label>
      <label class="check"><input type="checkbox" id="digits"><span data-i18n="PassGen_Digits"></span></label>
      <label class="check"><input type="checkbox" id="symbols"><span data-i18n="PassGen_Symbols"></span></label>
      <label class="check"><input type="checkbox" id="hexOnly"><span data-i18n="PassGen_HexOnly"></span></label>
      <label class="check"><input type="checkbox" id="excludeSimilar"><span data-i18n="PassGen_ExcludeSimilar"></span></label>
    </div>
    <label class="check"><input type="checkbox" id="requireEach"><span data-i18n="PassGen_RequireEach"></span></label>
    <label class="field"><span data-i18n="PassGen_SymbolChars"></span><input type="text" id="symbolChars" class="mono"></label>
  </fieldset>

  <fieldset id="opt-phrase" class="hidden">
    <legend data-i18n="PassGen_Options"></legend>
    <div class="grid2">
      <label class="field"><span data-i18n="PassGen_Words"></span><input type="number" id="words" min="3" max="12"></label>
      <label class="field"><span data-i18n="PassGen_Separator"></span><input type="text" id="separator" maxlength="1" class="mono"></label>
    </div>
    <label class="check"><input type="checkbox" id="capitalize"><span data-i18n="PassGen_Capitalize"></span></label>
    <label class="check"><input type="checkbox" id="addNumber"><span data-i18n="PassGen_AddNumber"></span></label>
    <div class="sub" data-i18n="PassGen_WordlistCredit"></div>
  </fieldset>

  <div class="row"><button type="button" id="reset" data-i18n="PassGen_Reset"></button></div>

  <details id="hist-box">
    <summary data-i18n="PassGen_History"></summary>
    <div class="row" style="margin:6px 0">
      <label class="check"><input type="checkbox" id="hist-show"><span data-i18n="PassGen_HistoryShow"></span></label>
      <div class="grow"></div>
      <button type="button" id="hist-clear" data-i18n="PassGen_HistoryClear"></button>
    </div>
    <div id="hist-locked" class="sub hidden"><span data-i18n="PassGen_HistoryLocked"></span> <button type="button" id="hist-unlock" class="flat" data-i18n="Tray_Login"></button></div>
    <ul id="hist"></ul>
  </details>
</main>
<script src="common.js"></script>
<script src="passgen.js"></script>
</body>
</html>
