<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TKRForm</title>
<link rel="stylesheet" href="common.css">
<style>
  body { display: flex; flex-direction: column; }
  #q { margin: 12px; width: calc(100% - 24px); font-size: 16px; padding: 8px 10px; }
  #list { flex: 1; overflow: auto; margin: 0; padding: 0 8px 8px; list-style: none; }
  #list li { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: var(--radius); cursor: pointer; }
  #list li[aria-selected=true] { background: var(--sky-light); }
  #list .name { font-weight: 600; }
  #list .meta { color: var(--ink-sub); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type { font-size: 11px; color: var(--sky-dark); border: 1px solid var(--sky); border-radius: 10px; padding: 0 7px; white-space: nowrap; }
  footer { padding: 6px 14px; border-top: 1px solid var(--line); color: var(--ink-sub); font-size: 12px; }
</style>
</head>
<body>
<input type="search" id="q" data-i18n-ph="Search_Placeholder" data-i18n-aria="Search_Placeholder" autocomplete="off">
<ul id="list" role="listbox"></ul>
<footer data-i18n="Search_Help"></footer>
<script src="common.js"></script>
<script src="search.js"></script>
</body>
</html>
