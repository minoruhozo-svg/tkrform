<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TKRForm</title>
<link rel="stylesheet" href="common.css">
<style>
  body { display: flex; flex-direction: column; }
  .tabs { padding: 0 12px; background: var(--panel); flex-wrap: wrap; }
  main { flex: 1; overflow: auto; padding: 14px 20px; }
  .pane { display: none; flex-direction: column; gap: 10px; max-width: 560px; }
  .pane.active { display: flex; }
  footer { display: flex; gap: 8px; padding: 10px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  .hotkey { font-family: var(--mono); }
  #backups { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #backups li { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<div class="tabs" role="tablist" id="tabs"></div>
<main id="panes"></main>
<footer>
  <div id="saved" class="sub grow" role="status"></div>
  <button type="button" id="save" class="primary" data-i18n="Common_Save"></button>
</footer>
<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
