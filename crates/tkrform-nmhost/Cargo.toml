[package]
name = "tkrform-nmhost"
version.workspace = true
edition.workspace = true
license = "MIT"

description = "TKRForm Native Messaging Host"

[[bin]]
name = "tkrform-nmhost"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
tkrform-ipc = { path = "../tkrform-ipc" }

serde_json.workspace = true

[dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"]
