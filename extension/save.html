<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TKRForm</title>
<link rel="stylesheet" href="ext.css">
<style>
  body { padding: 14px 16px 12px; background: var(--panel); }
  .col { gap: 9px; }
  .who { padding: 6px 8px; border-radius: 6px; background: var(--sky-light); overflow-wrap: anywhere; }
  .btns { display: flex; flex-direction: column; gap: 6px; }
  .btns .row button { flex: 1; }
</style>
</head>
<body>
<div class="col" id="main">
  <div class="brand"><img src="icons/icon32.png" alt=""><span id="title"></span></div>
  <div id="who" class="who"></div>
  <div id="locked" class="col hidden">
    <div class="msg warn" data-i18n="Ext_Save_NeedUnlock"></div>
    <input type="password" id="mp" data-i18n-ph="Ext_MasterPassword" autocomplete="off">
    <div class="row"><button type="button" id="unlock" class="primary" data-i18n="Ext_Unlock"></button><button type="button" id="cancel-locked" data-i18n="Common_Cancel"></button></div>
  </div>
  <div id="form" class="col hidden">
    <label class="field"><span data-i18n="Ext_Save_Name"></span><input type="text" id="name"></label>
    <label class="field"><span data-i18n="Ext_Save_Folder"></span><select id="folder"></select></label>
    <label class="check hidden" id="as-new-row"><input type="checkbox" id="as-new"><span data-i18n="Ext_Save_AsNew"></span></label>
  </div>
  <div id="err" class="msg error hidden" role="alert"></div>
  <div class="btns hidden" id="btns">
    <div class="row"><button type="button" id="save" class="primary"></button><button type="button" id="skip" data-i18n="Ext_Save_Skip"></button></div>
    <button type="button" id="never" class="flat" data-i18n="Ext_Save_Never"></button>
  </div>
</div>
<script src="ext.js"></script>
<script src="save.js"></script>
</body>
</html>
