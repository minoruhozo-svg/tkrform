<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TKRForm</title>
<link rel="stylesheet" href="ext.css">
<style>
  body { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }
  /* 横長のタイル（幅 300px 前後、高さ 160px）を、画面の幅に応じて 2〜4 列に並べる */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 16px; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 160px; padding: 14px; text-align: center; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-lg); cursor: pointer; }
  .tile:hover, .tile:focus-visible { border-color: var(--sky); }
  .tile:not(.hasbg):hover, .tile:not(.hasbg):focus-visible { background: var(--sky-light); }
  .tile .ico { height: 64px; display: flex; align-items: center; justify-content: center; }
  /* 高さを 56px にそろえる（小さい画像も、ほどよい大きさで見える）。横長のロゴは、縦横比を保って幅 200px まで */
  .tile .ico img { height: 56px; width: auto; max-width: 200px; object-fit: contain; }
  /* 画像がないとき: 名前の頭文字を、名前から決まる色の四角の上に出す（.av.xl） */
  .tile b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .fav { position: absolute; top: 8px; right: 12px; display: inline-flex; color: var(--amber); }
  .tile .fav .ic { width: 16px; height: 16px; fill: currentColor; }
  /* 画面の外のタイルは描画を省く（何千件でも軽い） */
  .tile { content-visibility: auto; contain-intrinsic-size: auto 160px; }
  #icon-note { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--ink-sub); }
  #icon-note a { color: var(--sky-dark); }
  #icon-note button { padding: 0; }
  h2.sec { grid-column: 1 / -1; margin: 12px 0 0; font-size: 13px; color: var(--ink-sub); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
</style>
</head>
<body>
<div class="row"><div class="brand grow"><img src="icons/icon48.png" alt="" style="width:32px;height:32px"><span style="font-size:20px">TKRForm</span></div><span id="count" class="sub"></span><input type="search" id="q" style="max-width:260px" data-i18n-ph="Ext_SearchPlaceholder"></div>
<div id="msg" class="msg warn hidden" style="margin-top:12px"></div>
<div id="icon-note" class="hidden"><span data-i18n="Ext_Home_IconsOff"></span><a href="#" id="icon-note-link" data-i18n="Ext_Home_IconsOffLink"></a><button type="button" class="flat" id="icon-note-close" data-i18n-aria="Common_Close" data-icon="x"></button></div>
<div id="grid"></div>
<script src="ext.js"></script>
<script src="start.js"></script>
</body>
</html>
